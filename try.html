function riskColor(risk) {
  if (risk >= 70)
    return { text: "text-red-600 dark:text-red-400", bg: "bg-red-500", soft: "bg-red-500/10" };
  if (risk >= 45)
    return { text: "text-amber-600 dark:text-amber-400", bg: "bg-amber-500", soft: "bg-amber-500/10" };
  return { text: "text-emerald-700 dark:text-emerald-400", bg: "bg-emerald-500", soft: "bg-emerald-500/10" };
}

/* ---------------------------------------------------------------------- */
/*  5-week wellness trend — scoring & recommendation helpers               */
/* ---------------------------------------------------------------------- */

function wellnessTier(score) {
  if (score >= 75) return { label: "Priority", text: "text-red-600 dark:text-red-400", soft: "bg-red-500/10", bar: "bg-red-500", border: "border-red-500/40" };
  if (score >= 55) return { label: "High", text: "text-orange-600 dark:text-orange-400", soft: "bg-orange-500/10", bar: "bg-orange-500", border: "border-orange-500/40" };
  if (score >= 35) return { label: "Moderate", text: "text-amber-600 dark:text-amber-400", soft: "bg-amber-500/10", bar: "bg-amber-500", border: "border-amber-500/40" };
  return { label: "Low", text: "text-emerald-700 dark:text-emerald-400", soft: "bg-emerald-500/10", bar: "bg-emerald-500", border: "border-emerald-500/40" };
}

function wellnessScoreFrom(mood, sleep, workload) {
  return Math.max(5, Math.min(97, Math.round((10 - mood) * 5.2 + (10 - sleep) * 3.1 + workload * 2.7)));
}

function computeWellnessFactors(weeks) {
  const n = weeks.length || 1;
  const avgMood = weeks.reduce((a, w) => a + w.mood, 0) / n;
  const avgSleep = weeks.reduce((a, w) => a + w.sleep, 0) / n;
  const avgWorkload = weeks.reduce((a, w) => a + w.workload, 0) / n;
  const slope = (weeks[weeks.length - 1]?.score ?? 0) - (weeks[0]?.score ?? 0);

  const raw = [
    { key: "workload", label: `Average workload pressure rated ${avgWorkload.toFixed(1)}/10 across 5 weeks`, mag: avgWorkload * 9 },
    { key: "sleep", label: `Sleep quality averaged ${avgSleep.toFixed(1)}/10, below a healthy baseline`, mag: (10 - avgSleep) * 9 },
    { key: "mood", label: `Self-reported mood trended to ${avgMood.toFixed(1)}/10 over the period`, mag: (10 - avgMood) * 9 },
    { key: "trend", label: `Risk score climbed ${Math.max(slope, 0)} points over 5 weeks`, mag: Math.min(100, Math.max(slope, 0) * 2.6) },
  ].sort((a, b) => b.mag - a.mag).slice(0, 4);

  const total = raw.reduce((a, r) => a + r.mag, 0) || 1;
  return raw.map((r) => ({ ...r, weight: Math.max(6, Math.round((r.mag / total) * 100)) }));
}

function wellnessRecommendationsFor(tierLabel, factors) {
  const top = factors[0]?.key;
  const actionsByTier = {
    Low: [
      "No action required — your indicators are within a healthy range.",
      "Keep up your current sleep and duty rhythm.",
      "Continue voluntary weekly check-ins so any change is caught early.",
    ],
    Moderate: [
      "Consider an optional conversation with your peer support network this week.",
      "Review your duty roster for the next fortnight — small adjustments help early.",
      "Keep an eye on sleep; small consistent improvements compound.",
    ],
    High: [
      "A welfare officer will reach out for a confidential, non-disciplinary conversation.",
      "A temporary adjustment to night-shift frequency is recommended for 2 weeks.",
      "Consider one mandatory rest day this rotation to recover baseline.",
    ],
    Priority: [
      "Immediate confidential session recommended with a welfare officer or counselor.",
      "Temporary stand-down from high-intensity duty is advised, pending review.",
      "Clinical referral is available if you'd like — entirely your choice, entirely confidential.",
    ],
  };

  const toplineByFactor = {
    workload: "Your workload pressure is the single biggest contributor — that's the first thing worth addressing.",
    sleep: "Sleep disruption is driving most of this signal — recovery starts there.",
    mood: "Your mood self-ratings are the leading factor — a conversation with someone you trust can help.",
    trend: "The pace of change matters as much as the level — this trend was caught before it peaked.",
  };

  return { topline: toplineByFactor[top], actions: actionsByTier[tierLabel] };
}

function SeverityBadge({ severity }) {
  const map = {
    high: { label: "High priority", cls: "bg-red-500/10 text-red-500 dark:text-red-400 border-red-500/30", dot: "bg-red-500" },
    medium: { label: "Medium priority", cls: "bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/30", dot: "bg-amber-500" },
    low: { label: "Low priority", cls: "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30", dot: "bg-emerald-500" },
  };
  const m = map[severity] || map.low;
  return (
    <span className={`inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-xs font-medium ${m.cls}`}>
      <span className={`h-1.5 w-1.5 rounded-full ${m.dot}`} />
      {m.label}
    </span>
  );
}

function generateCaptcha() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < 5; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

  const [serviceId, setServiceId] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [captchaCode, setCaptchaCode] = useState(generateCaptcha);
  const [captchaInput, setCaptchaInput] = useState("");
  const [role, setRole] = useState("personnel");
  const [agree, setAgree] = useState(false);
  const [error, setError] = useState("");
  const [otp, setOtp] = useState("");
  const [otpError, setOtpError] = useState("");

  useEffect(() => {
    if (step !== "otp" || resendTimer <= 0) return;
    const t = setTimeout(() => setResendTimer((s) => s - 1), 1000);
    return () => clearTimeout(t);
  }, [step, resendTimer]);

  const roles = Object.entries(ROLE_CREDENTIALS).map(([id, r]) => ({ id, label: r.label }));

  function refreshCaptcha() {
    setCaptchaCode(generateCaptcha());
    setCaptchaInput("");
  }

  function submitCredentials(e) {
    e.preventDefault();
    if (!serviceId.trim() || !password.trim()) {
      setError("Enter your Service ID and password to continue.");
      return;

    if (password.trim() !== ROLE_CREDENTIALS[role].password) {
      setError(`Incorrect password for ${ROLE_CREDENTIALS[role].label}. Check the demo password below and try again.`);
      return;
    }
    if (captchaInput.trim().toUpperCase() !== captchaCode) {
      setError("The verification code entered does not match. Try again.");
      refreshCaptcha();
      return;
    }
    if (!agree) {
      setError("You must acknowledge the usage notice to proceed.");
      return;
    }
    setError("");
    setResendTimer(30);
    setStep("otp");
  }

  function submitOtp(e) {
    e.preventDefault();
    if (otp.trim() !== DEMO_OTP) {

      return;

function PSIGauge({ value, label }) {
  const risk = value >= 70 ? "high" : value >= 45 ? "medium" : "low";
  const data = [{ name: "psi", value, fill: "url(#psiGradient)" }];
  const tone =
    risk === "high" ? "text-red-500 dark:text-red-400" : risk === "medium" ? "text-amber-600 dark:text-amber-400" : "text-emerald-600 dark:text-emerald-400";
  const stops = risk === "high" ? ["#fca5a5", "#dc2626"] : risk === "medium" ? ["#fcd34d", "#b45309"] : ["#6ee7b7", "#047857"];
  return (
    <div className="relative flex flex-col items-center">
      <div className="h-40 w-40">
        <ResponsiveContainer width="100%" height="100%">
          <RadialBarChart innerRadius="72%" outerRadius="100%" data={data} startAngle={90} endAngle={-270}>
            <defs>
              <linearGradient id="psiGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor={stops[0]} />
                <stop offset="100%" stopColor={stops[1]} />
              </linearGradient>
              <filter id="psiGlow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="3.2" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <PolarAngleAxis type="number" domain={[0, 100]} angleAxisId={0} tick={false} />
            <RadialBar
              background={{ fill: "rgba(120,90,40,0.14)" }}
              dataKey="value"
              cornerRadius={20}
              fill="url(#psiGradient)"
              style={{ filter: "url(#psiGlow)" }}
            />
          </RadialBarChart>
        </ResponsiveContainer>
      </div>
      <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center">
        <p className="text-3xl font-semibold text-stone-900 dark:text-stone-100" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
          {value}
        </p>
        <p className="text-[10px] uppercase tracking-wide text-stone-600 dark:text-stone-500">PSI</p>
      </div>
      <p className={`mt-2 text-sm font-semibold ${tone}`}>{label}</p>
    </div>
  );
}

function useWeeklyWellnessLog() {
  const [weeks, setWeeks] = useState([]); // {week, score, mood, sleep, workload}
  const [mood, setMood] = useState(6);
  const [sleep, setSleep] = useState(6);
  const [workload, setWorkload] = useState(6);

  function logWeek() {
    if (weeks.length >= 5) return;
    const score = wellnessScoreFrom(mood, sleep, workload);
    setWeeks((w) => [...w, { week: `Wk ${w.length + 1}`, score, mood, sleep, workload }]);
  }

  function fastForward() {
    setWeeks((w) => {
      const next = [...w];
      for (let i = w.length; i < 5; i++) {
        next.push({
          week: `Wk ${i + 1}`,
          score: WELLNESS_DEMO_TRAJECTORY[i],
          mood: Math.max(2, 8 - i * 1.3),
          sleep: Math.max(2, 7.5 - i * 1.2),
          workload: Math.min(9.5, 5 + i * 1.1),
        });
      }
      return next;
    });
  }

  function reset() {
    setWeeks([]);
    setMood(6);
    setSleep(6);
    setWorkload(6);
  }

  return { weeks, mood, setMood, sleep, setSleep, workload, setWorkload, logWeek, fastForward, reset };
}

function WellnessStepper({ count, total = 5 }) {
  return (
    <div className="mb-5 flex items-center gap-1.5">
      {Array.from({ length: total }).map((_, i) => {
        const done = i < count;
        const current = i === count;
        return (
          <React.Fragment key={i}>
            <div
              className={`flex h-7 w-7 shrink-0 items-center justify-center rounded-full border text-xs font-semibold ${
                done
                  ? "border-brass-500 bg-brass-500 text-stone-950"
                  : current
                  ? "border-stone-500 dark:border-stone-400 bg-stone-800 dark:bg-stone-700 text-white"
                  : "border-stone-300 dark:border-stone-600 bg-white dark:bg-stone-900 text-stone-500 dark:text-stone-400"
              }`}
              style={{ fontFamily: "'JetBrains Mono', monospace" }}
            >
              {done ? <Check size={13} /> : i + 1}
            </div>
            {i < total - 1 && (
              <div className={`h-0.5 flex-1 rounded-full ${i < count ? "bg-brass-500" : "bg-stone-200 dark:bg-stone-700"}`} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function HeatmapGrid({ units }) {
  const rows = [
    { key: "nightShiftStreak", label: "Shift fatigue (night streak)", max: 20 },
    { key: "deployment", label: "Deployment duration", max: 160 },
    { key: "leaveBacklog", label: "Leave backlog", max: 100 },
  ];
  return (
    <div className="overflow-x-auto">
      <table className="w-full min-w-[480px] border-separate border-spacing-1.5">
        <thead>
          <tr>
            <th className="text-left text-[11px] font-medium text-stone-600 dark:text-stone-500"> </th>
            {units.map((u) => (
              <th key={u.id} className="pb-1 text-center text-[11px] font-medium text-stone-500 dark:text-stone-400">
                {u.name}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((row) => (
            <tr key={row.key}>
              <td className="pr-2 text-[11px] text-stone-500 dark:text-stone-400">{row.label}</td>
              {units.map((u) => {
                const val = u[row.key];
                const intensity = Math.min(1, val / row.max);
                const bg = intensity > 0.66 ? "bg-red-500" : intensity > 0.33 ? "bg-amber-500" : "bg-emerald-500";
                const opacity = 0.25 + intensity * 0.75;
                return (
                  <td key={u.id} className="p-0">
                    <div
                      className={`flex h-12 items-center justify-center rounded ${bg} text-xs font-medium text-stone-950`}
                      style={{ opacity, fontFamily: "'JetBrains Mono', monospace" }}
                    >
                      {row.key === "leaveBacklog" ? `${val}%` : row.key === "deployment" ? `${val}d` : val}
                    </div>
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

          {sorted.map((c) => (
            <CaseRow key={c.id} item={c} onOpen={setOpenCase} />
          ))}
        </div>
      </div>

      <div className="rounded-lg border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-800 p-5">
        <div className="mb-3 flex items-center justify-between">
          <h2 className="flex items-center gap-2 text-sm font-semibold uppercase tracking-wider text-stone-900 dark:text-stone-100 font-display">
            <FileText size={15} className="text-stone-500 dark:text-stone-400" /> Secure clinical notes
          </h2>
          <span className="flex items-center gap-1 text-[11px] text-emerald-700 dark:text-emerald-400">
            <Lock size={11} /> Locally encrypted
          </span>
        </div>
        <textarea
          value={notes}
          onChange={(e) => setNotes(e.target.value)}
          placeholder="Log session notes, observations, or follow-up actions..."
          rows={4}
          className="w-full resize-none rounded-md border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 px-3 py-2 text-sm text-stone-800 dark:text-stone-200 placeholder-stone-400 dark:placeholder-stone-600 focus:border-brass-500 dark:focus:border-brass-400 focus:outline-none focus:ring-2 focus:ring-brass-500/15 dark:focus:ring-brass-400/15"
        />
        <div className="mt-2 flex justify-end">
          <button
            disabled={!notes.trim()}
            onClick={() => setNotes("")}
            className="flex items-center gap-1.5 rounded-md bg-brass-500 px-3 py-1.5 text-xs font-semibold text-stone-950 hover:bg-brass-400 transition-colors shadow-brass disabled:cursor-not-allowed disabled:bg-stone-200 dark:disabled:bg-stone-700 disabled:text-stone-400 dark:disabled:text-stone-500"
          >
            <Send size={12} /> Save note
          </button>
        </div>
      </div>

      {openCase && (
        <XAIModal
          selectedCase={openCase}
          onClose={() => setOpenCase(null)}
          onAction={(kind) => {
            setConfirm({ caseId: openCase.id, kind });
            setOpenCase(null);
          }}
        />
      )}

      {confirm && <LeaveConfirmModal caseId={confirm.caseId} kind={confirm.kind} onClose={() => setConfirm(null)} />}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Root                                                                    */
/* ---------------------------------------------------------------------- */

function getInitialTheme() {
  try {
    const stored = window.localStorage.getItem("prahari-theme");
    if (stored === "light" || stored === "dark") return stored;
  } catch (e) {
    /* localStorage unavailable — fall back to system preference */
  }
  if (typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
    return "light";
  }
  return "dark";
}

function PrahariApp() {
  const [authenticated, setAuthenticated] = useState(false);
  const [role, setRole] = useState("personnel");
  const [theme, setTheme] = useState(getInitialTheme);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
    try {
      window.localStorage.setItem("prahari-theme", theme);
    } catch (e) {
      /* ignore persistence errors */
    }
  }, [theme]);

  const toggleTheme = () => setTheme((t) => (t === "dark" ? "light" : "dark"));

  if (!authenticated) {
    return (
      <LoginPortal
        theme={theme}
        onToggleTheme={toggleTheme}
        onAuthenticated={(r) => {
          setRole(r);
          setAuthenticated(true);
        }}
      />
    );
  }

  return (
    <div className="min-h-screen bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100">
      <TopBar role={role} onLogout={() => setAuthenticated(false)} theme={theme} onToggleTheme={toggleTheme} />

      {role === "personnel" && <PersonnelView />}
      {role === "commander" && <CommanderView />}
      {role === "welfare" && <WelfareView />}

      <footer className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-6 text-center text-[11px] text-stone-400 dark:text-stone-600">
        Prahari is a decision-support tool. It does not replace clinical judgment or established welfare protocols.
      </footer>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Mount                                                                   */
/* ---------------------------------------------------------------------- */

const rootEl = document.getElementById("root");
const root = createRoot(rootEl);
root.render(<PrahariApp />);

</script>
</body>
</html>
